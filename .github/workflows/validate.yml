name: HTML5 foundation CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  html5-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static parse and unit tests
        run: npm run check
      - name: Check original illustration files
        run: |
          for file in hero elder merchant herb bandit; do test -s "assets/${file}.svg" || exit 1; done
  swf-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory SWF header and tags without exporting protected content
        run: python tools/inspect_swf.py jin.swf --out reports/swf_inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: swf-structural-inventory
          path: reports/swf_inventory.json

  ffdec-java8-probe:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Check legacy FFDec CLI on original SWF (private ephemeral export)
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -s FFDec/ffdec.jar
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          set +e
          timeout 300s java -Djava.awt.headless=true -Xmx2g -jar FFDec/ffdec.jar -cli -export script "$scratch/scripts" jin.swf > "$scratch/ffdec.log" 2>&1
          status=$?
          set -e
          echo "FFDec exit status: $status"
          if [[ "$status" -ne 0 ]]; then
            echo "FFDec Java 8 CLI export did not complete. Raw log remains ephemeral."
            exit 1
          fi
          count=$(find "$scratch/scripts" -type f | wc -l)
          echo "Exported script files (count only): $count"
          test "$count" -gt 0
          echo "No decompiled scripts or source graphics are uploaded or committed."
