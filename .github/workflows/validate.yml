name: HTML5 foundation CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  html5-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static parse and unit tests
        run: npm run check
      - name: Check original illustration files
        run: |
          for file in hero elder merchant herb bandit; do test -s "assets/${file}.svg" || exit 1; done
  swf-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory SWF header and tags without exporting protected content
        run: python tools/inspect_swf.py jin.swf --out reports/swf_inventory.json
      - name: Index main-timeline action tags and frame labels (source-free)
        run: python tools/index_swf_timeline.py jin.swf --out reports/swf_main_timeline_evidence.json
      - name: Test source-free script index and review queue
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke-test standalone audit CLI imports
        run: python tools/build_stable_audit_set.py --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: swf-structural-inventory
          path: reports/swf_inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: swf-main-timeline-evidence
          path: reports/swf_main_timeline_evidence.json
          if-no-files-found: error

  ffdec-java8-probe:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Check legacy FFDec CLI on original SWF (private ephemeral export)
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -s FFDec/ffdec.jar
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          set +e
          timeout 300s java -Djava.awt.headless=true -Xmx2g -jar FFDec/ffdec.jar -cli -export script "$scratch/scripts" jin.swf > "$scratch/ffdec.log" 2>&1
          status=$?
          set -e
          echo "FFDec exit status: $status"
          if [[ "$status" -ne 0 ]]; then
            echo "FFDec Java 8 CLI export did not complete. Raw log remains ephemeral."
            exit 1
          fi
          count=$(find "$scratch/scripts" -type f | wc -l)
          echo "Exported script files (count only): $count"
          test "$count" -gt 0
          python3 tools/index_ffdec_scripts.py "$scratch/scripts" --source-swf jin.swf --out reports/ffdec_script_index.json
          indexed=$(python3 -c 'import json; print(json.load(open("reports/ffdec_script_index.json"))["script_file_count"])')
          test "$indexed" -eq "$count"
          python3 tools/build_review_queue.py reports/ffdec_script_index.json --out reports/ffdec_review_queue.json --limit 100
          python3 tools/build_evidence_ledger.py "$scratch/scripts" --source-swf jin.swf --queue reports/ffdec_review_queue.json --out reports/ffdec_syntax_evidence_ledger.json
          python3 tools/build_frame_jump_evidence.py "$scratch/scripts" --source-swf jin.swf --queue reports/ffdec_review_queue.json --out reports/ffdec_frame_jump_evidence.json
          # Independently export the same SWF a second time in a fresh directory.
          # Keep both decompiled source trees and FFDec logs ephemeral.
          set +e
          timeout 300s java -Djava.awt.headless=true -Xmx2g -jar FFDec/ffdec.jar -cli -export script "$scratch/scripts_repeat" jin.swf > "$scratch/ffdec_repeat.log" 2>&1
          repeat_status=$?
          set -e
          echo "Second FFDec exit status: $repeat_status"
          test "$repeat_status" -eq 0
          python3 tools/index_ffdec_scripts.py "$scratch/scripts_repeat" --source-swf jin.swf --out "$scratch/index_repeat.json"
          python3 tools/build_review_queue.py "$scratch/index_repeat.json" --out "$scratch/queue_repeat.json" --limit 100
          python3 tools/build_frame_jump_evidence.py "$scratch/scripts_repeat" --source-swf jin.swf --queue "$scratch/queue_repeat.json" --out "$scratch/jumps_repeat.json"
          python3 tools/compare_ffdec_exports.py \
            --index-a reports/ffdec_script_index.json --index-b "$scratch/index_repeat.json" \
            --queue-a reports/ffdec_review_queue.json --queue-b "$scratch/queue_repeat.json" \
            --jumps-a reports/ffdec_frame_jump_evidence.json --jumps-b "$scratch/jumps_repeat.json" \
            --out reports/ffdec_reproducibility.json
          python3 tools/build_stable_audit_set.py \
            --index-a reports/ffdec_script_index.json --index-b "$scratch/index_repeat.json" \
            --queue-a reports/ffdec_review_queue.json --queue-b "$scratch/queue_repeat.json" \
            --jumps-a reports/ffdec_frame_jump_evidence.json --jumps-b "$scratch/jumps_repeat.json" \
            --out reports/ffdec_stable_audit_set.json
          python3 tools/diagnose_ffdec_drift.py \
            --scripts-a "$scratch/scripts" --scripts-b "$scratch/scripts_repeat" \
            --index-a reports/ffdec_script_index.json --index-b "$scratch/index_repeat.json" \
            --out reports/ffdec_drift_diagnostics.json
          if [[ "$(python3 -c 'import json; print(json.load(open("reports/ffdec_reproducibility.json"))["comparison_status"])')" == "divergent" ]]; then
            echo "::warning title=FFDec export drift::Two Java 8 exports of the same SWF diverged. Syntax counts must not be treated as stable story evidence."
          fi
          echo "Only hashed script fingerprints and syntax locations are exported; all candidates remain unverified."
          echo "No decompiled scripts or source graphics are uploaded or committed."
      - name: Upload source-free script evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-script-index
          path: reports/ffdec_script_index.json
          if-no-files-found: error
      - name: Upload source-free review queue only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-review-queue
          path: reports/ffdec_review_queue.json
          if-no-files-found: error

      - name: Upload source-free syntax evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-syntax-evidence
          path: reports/ffdec_syntax_evidence_ledger.json
          if-no-files-found: error

      - name: Upload source-free literal frame jump evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-frame-jumps
          path: reports/ffdec_frame_jump_evidence.json
          if-no-files-found: error

      - name: Upload aggregate FFDec reproducibility evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-reproducibility
          path: reports/ffdec_reproducibility.json
          if-no-files-found: error

      - name: Upload reproducible syntax candidate manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-stable-audit-set
          path: reports/ffdec_stable_audit_set.json
          if-no-files-found: error

      - name: Upload source-free byte-level drift diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: ffdec-source-free-drift-diagnostics
          path: reports/ffdec_drift_diagnostics.json
          if-no-files-found: error
